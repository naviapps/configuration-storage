[swift]
executable = "ConfigurationStorageConsumer"
inputs = ["Package.swift", "Sources", "Tests", "Artifacts", "ThirdParty", "LICENSE"]

[rust_c]
git_url = "https://github.com/naviapps/configuration-storage.git"
rust_packages = ["configuration-storage"]

[rust_c.c]
framework = "Artifacts/CConfigurationStorage.xcframework/macos-arm64_x86_64/CConfigurationStorage.framework"
header = "configuration_storage.h"

[windows_bindings]
packages = ["configuration-storage-ffi"]
projects = ["bindings/dotnet/tests/ConfigurationStorage.Tests/ConfigurationStorage.Tests.csproj"]
arguments = ["--native"]

[nuget]
package_id = "NaviApps.ConfigurationStorage"
fixtures = ["fixtures/consumers/dotnet/Program.cs"]
windows_x64 = true
