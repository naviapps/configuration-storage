[macos]
commands = [
  ["xcrun", "swift", "--version"],
  ["cargo", "fetch", "--locked"],
  ["make", "check-distribution"],
  ["sdk-tooling", "swift-consumer", "--distribution"],
]

[windows]
commands = [
  ["rustup", "install", "--no-self-update"],
  ["sdk-tooling", "python", "-m", "unittest", "discover", "-s", "fixtures/distribution/tests"],
  ["sdk-tooling", "windows", "-m", "fixtures.distribution.windows"],
]
