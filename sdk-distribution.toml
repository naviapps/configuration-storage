[macos]
commands = [
  ["xcrun", "swift", "--version"],
  ["cargo", "fetch", "--locked"],
  ["make", "check-distribution", 'SDK_TOOLING=python3 -I -B "{tooling}/tasks/sdk"'],
  ["python3", "-I", "-B", "{tooling}/tasks/sdk", "swift-consumer", "--distribution"],
]

[windows]
commands = [
  ["rustup", "install", "--no-self-update"],
  ["python", "-E", "-S", "-B", "-m", "unittest", "discover", "-s", "tools/tests"],
  ["python", "-I", "-B", "{tooling}/tasks/sdk", "windows", "tools/windows.py"],
]
